name: Refresh Live Facts

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for fact drift
        id: drift
        run: |
          if python3 scripts/refresh_home_live.py --check; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh surfaces and open or update the pull request
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch=bot/refresh-live-facts
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          python3 scripts/refresh_home_live.py
          if git diff --quiet; then
            echo "no changes to commit"
            exit 0
          fi
          git commit -am "Refresh live validator and Task Node facts"
          git push --force-with-lease origin "$branch"
          if gh pr view "$branch" --json number >/dev/null 2>&1; then
            echo "existing pull request updated"
          else
            gh pr create \
              --base main \
              --head "$branch" \
              --title "Refresh live validator and Task Node facts" \
              --body "Automated refresh by \`scripts/refresh_home_live.py\`. Validator source: https://vhs.testnet.postfiat.org/v1/network/validators/test"
          fi
